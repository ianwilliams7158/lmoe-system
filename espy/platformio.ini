; ============================================================
; LMoE Espy — PlatformIO Build Configuration
; Target: ESP32-2432S028R (Cheap Yellow Display / CYD)
;
; BUILD INSTRUCTIONS (for Ian — to produce lmoe_espy.bin)
; --------------------------------------------------------
; 1. Install PlatformIO: https://platformio.org/install/cli
; 2. Run from this directory:
;      pio run
; 3. The compiled binary will be at:
;      .pio/build/esp32dev/firmware.bin
; 4. Copy that file to espy/firmware/lmoe_espy.bin in the repo
; 5. The installer flashes it automatically with esptool
;
; NOTE: End users never need PlatformIO — they flash the
; pre-compiled lmoe_espy.bin using the installer.
; ============================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; ---- Serial ----
monitor_speed = 115200
upload_speed  = 921600

; ---- Board-specific: ESP32-2432S028R (CYD) ----
; 4MB flash, standard partition scheme
board_build.partitions = default.csv
board_build.flash_mode = dio
board_build.f_flash     = 80000000L

; ---- Libraries ----
lib_deps =
  ; TFT display — matches the ILI9341 on CYD
  bodmer/TFT_eSPI @ ^2.5.43

  ; Touchscreen — XPT2046 controller on CYD
  PaulStoffregen/XPT2046_Touchscreen @ ^1.4

  ; GPS NMEA parsing
  mikalhart/TinyGPSPlus @ ^1.0.3

  ; WiFi + HTTP (built into ESP32 Arduino framework, included here for clarity)
  ; HTTPClient — built-in
  ; WiFi      — built-in

  ; JSON parsing and serialisation
  bblanchon/ArduinoJson @ ^7.0.0

; ---- Build flags ----
build_flags =
  ; TFT_eSPI display configuration for CYD ILI9341
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_MISO=12
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D LOAD_FONT7=1
  -D LOAD_FONT8=1
  -D LOAD_GFXFF=1
  -D SMOOTH_FONT=1
  -D SPI_FREQUENCY=55000000
  -D SPI_READ_FREQUENCY=20000000
  -D SPI_TOUCH_FREQUENCY=2500000
  ; SD card SPI pins (CYD has onboard SD slot)
  -D SD_CS=5
  ; Stack and heap tuning
  -D CONFIG_ARDUINO_LOOP_STACK_SIZE=8192
  ; Suppress noisy warnings
  -w
